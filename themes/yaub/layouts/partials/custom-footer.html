<!-- Code block tabs: listing title on the left, language on the right.
     Styles live here so they cannot drift from a cached code.css. -->
<style>
.code-block-wrapper {
    position: relative;
    margin-top: 0;
}
.code-block-tabbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    width: 100%;
}
.code-language-badge,
.code-title-badge {
    display: inline-block;
    box-sizing: border-box;
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 600;
    /* Sit on page chrome above the dark <pre> — use code-block colours so
       light mode keeps readable contrast (was ~1:1 white-on-white). */
    background: #282c34 !important;
    color: #d0d4db !important;
    border-radius: 5px 5px 0 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin-bottom: -1px;
    position: relative;
    z-index: 1;
    max-width: 70%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.code-language-badge {
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-left: auto;
}
.code-title-badge {
    text-transform: none;
    letter-spacing: 0.2px;
    margin-right: auto;
    margin-left: 0;
}
.code-block-wrapper pre {
    margin-top: 0 !important;
    text-align: left;
}
.code-block-wrapper.has-language pre {
    border-top-right-radius: 0 !important;
}
.code-block-wrapper.has-title pre {
    border-top-left-radius: 0 !important;
}
</style>
