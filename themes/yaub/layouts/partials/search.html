<div class="searchbox">
    <label for="search-by"><i class="fas fa-search" aria-hidden="true"></i><span class="sr-only">Search</span></label>
    <input data-search-input id="search-by" type="search" placeholder="{{T "Search-placeholder"}}" aria-label="Search articles">
    <button type="button" data-search-clear="" aria-label="Clear search"><i class="fas fa-times" aria-hidden="true"></i></button>
</div>
<script defer src="{{ partialCached "yaub/asset-url.html" "js/lunr.min.js" "js/lunr.min.js" }}"></script>
<script defer src="{{ partialCached "yaub/asset-url.html" "js/auto-complete.js" "js/auto-complete.js" }}"></script>
<script>
    {{ if hugo.IsMultilingual }}
        var baseurl = "{{.Site.BaseURL}}{{.Site.LanguagePrefix}}";
    {{ else }}
        var baseurl = "{{.Site.BaseURL}}";
    {{ end }}
</script>
<script defer src="{{ partialCached "yaub/asset-url.html" "js/search.js" "js/search.js" }}"></script>
