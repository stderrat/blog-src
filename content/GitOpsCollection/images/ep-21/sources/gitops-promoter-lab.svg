<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="600" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="52" font-size="24" font-weight="bold" fill="#0f172a">The lab: one hub, three target clusters</text>
  <text x="40" y="80" font-size="15" fill="#475569">Everything runs on the hub. The target clusters only receive manifests (push model).</text>

  <!-- Git provider -->
  <rect x="40" y="120" width="250" height="420" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="152" font-size="17" font-weight="bold" fill="#1e3a8a">GitHub</text>
  <text x="60" y="174" font-size="13" fill="#64748b">repository promoter-demo</text>
  <g font-family="DejaVu Sans Mono, Menlo, monospace" font-size="13" fill="#0f172a">
    <rect x="58" y="196" width="214" height="34" rx="8" fill="#eff6ff"/>
    <text x="70" y="218">main  (DRY)</text>
    <text x="70" y="262">environment/dev-next</text>
    <text x="70" y="286">environment/dev</text>
    <text x="70" y="320">environment/test-next</text>
    <text x="70" y="344">environment/test</text>
    <text x="70" y="378">environment/prod-next</text>
    <text x="70" y="402">environment/prod</text>
  </g>
  <rect x="58" y="426" width="214" height="100" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="70" y="454" font-size="13" font-weight="bold" fill="#5b21b6">Pull requests</text>
  <text x="70" y="476" font-size="12.5" fill="#475569">opened, updated and merged</text>
  <text x="70" y="496" font-size="12.5" fill="#475569">by the Promoter, with</text>
  <text x="70" y="516" font-size="12.5" fill="#475569">commit statuses as checks</text>

  <!-- Hub -->
  <rect x="380" y="120" width="440" height="420" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="400" y="152" font-size="17" font-weight="bold" fill="#0f172a">Hub cluster</text>
  <text x="400" y="174" font-size="13" fill="#64748b">OpenShift GitOps 1.22 · namespace openshift-gitops</text>

  <rect x="400" y="196" width="400" height="66" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="418" y="224" font-size="15" font-weight="bold" fill="#155e75">Commit server (Source Hydrator)</text>
  <text x="418" y="246" font-size="12.5" fill="#475569">renders main and pushes to environment/*-next</text>

  <rect x="400" y="276" width="400" height="66" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="418" y="304" font-size="15" font-weight="bold" fill="#5b21b6">GitOps Promoter controller + API server</text>
  <text x="418" y="326" font-size="12.5" fill="#475569">opens PRs, sets commit statuses, watches App health</text>

  <rect x="400" y="356" width="400" height="164" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="418" y="384" font-size="15" font-weight="bold" fill="#0f172a">Argo CD application controller</text>
  <text x="418" y="406" font-size="12.5" fill="#475569">syncs environment/* (never *-next)</text>
  <g font-family="DejaVu Sans Mono, Menlo, monospace" font-size="13">
    <rect x="418" y="424" width="364" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="430" y="442" fill="#0f172a">Application hello-dev  → dev-cluster</text>
    <rect x="418" y="454" width="364" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="430" y="472" fill="#0f172a">Application hello-test → test-cluster</text>
    <rect x="418" y="484" width="364" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="430" y="502" fill="#0f172a">Application hello-prod → prod-cluster</text>
  </g>


  <!-- Git arrows -->
  <path d="M400,229 H296" stroke="#0e7490" stroke-width="2" fill="none" marker-end="url(#aT)"/>
  <text x="300" y="220" font-size="12" fill="#155e75">push</text>
  <path d="M400,309 H296" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#aV)"/>
  <text x="300" y="300" font-size="12" fill="#5b21b6">PRs</text>
  <path d="M296,438 H400" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="300" y="430" font-size="12" fill="#475569">read</text>

  <!-- Target clusters -->
  <g>
    <rect x="930" y="150" width="230" height="90" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="1045" y="190" font-size="17" font-weight="bold" text-anchor="middle" fill="#14532d">dev-cluster</text>
    <text x="1045" y="214" font-size="12.5" text-anchor="middle" fill="#475569">namespace hello-promoter</text>
    <rect x="930" y="285" width="230" height="90" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="1045" y="325" font-size="17" font-weight="bold" text-anchor="middle" fill="#14532d">test-cluster</text>
    <text x="1045" y="349" font-size="12.5" text-anchor="middle" fill="#475569">namespace hello-promoter</text>
    <rect x="930" y="420" width="230" height="90" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="1045" y="460" font-size="17" font-weight="bold" text-anchor="middle" fill="#14532d">prod-cluster</text>
    <text x="1045" y="484" font-size="12.5" text-anchor="middle" fill="#475569">namespace hello-promoter</text>
  </g>
  <path d="M782,437 C870,437 860,195 924,195" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M782,467 C870,467 860,330 924,330" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M782,497 C870,497 860,465 924,465" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="930" y="545" font-size="12.5" fill="#475569">registered as cluster secrets</text>
  <text x="930" y="563" font-size="12.5" fill="#475569">in openshift-gitops</text>
</svg>
