<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="640" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="52" font-size="24" font-weight="bold" fill="#0f172a">One change, three environments</text>
  <text x="40" y="80" font-size="15" fill="#475569">You commit once to main. The hydrator renders, the Promoter moves the result through PRs, Argo CD deploys.</text>

  <!-- column headers -->
  <g font-size="13" font-weight="bold" fill="#64748b" letter-spacing="1">
    <text x="40" y="124">AUTHOR</text>
    <text x="320" y="124">PROPOSED (HYDRATED)</text>
    <text x="560" y="124">PROMOTION PR</text>
    <text x="740" y="124">ACTIVE (LIVE)</text>
    <text x="990" y="124">CLUSTER (PUSH)</text>
  </g>

  <!-- main DRY branch -->
  <rect x="40" y="168" width="210" height="96" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="198" font-size="17" font-weight="bold" fill="#1e3a8a">main</text>
  <text x="58" y="222" font-size="14" fill="#334155">DRY branch</text>
  <text x="58" y="244" font-size="13" fill="#64748b">Kustomize base + overlays</text>

  <!-- hydrator -->
  <rect x="40" y="392" width="210" height="96" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <text x="58" y="422" font-size="17" font-weight="bold" fill="#155e75">Source Hydrator</text>
  <text x="58" y="446" font-size="14" fill="#334155">Argo CD commit server</text>
  <text x="58" y="468" font-size="13" fill="#64748b">renders + pushes YAML</text>

  <path d="M145,264 V386" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="156" y="330" font-size="13" fill="#475569">git push</text>

  <!-- hydrator to -next branches -->
  <path d="M250,420 C285,420 285,200 314,200" stroke="#0e7490" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M250,440 C285,440 285,360 314,360" stroke="#0e7490" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M250,460 C285,460 285,520 314,520" stroke="#0e7490" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- rows -->
  <g font-family="DejaVu Sans Mono, Menlo, monospace" font-size="14">
    <!-- dev -->
    <rect x="320" y="172" width="210" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="336" y="206" fill="#0f172a">environment/dev-next</text>
    <rect x="740" y="172" width="190" height="56" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="756" y="206" fill="#0f172a">environment/dev</text>
    <!-- test -->
    <rect x="320" y="332" width="210" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="330" y="366" fill="#0f172a">environment/test-next</text>
    <rect x="740" y="332" width="190" height="56" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="752" y="366" fill="#0f172a">environment/test</text>
    <!-- prod -->
    <rect x="320" y="492" width="210" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="330" y="526" fill="#0f172a">environment/prod-next</text>
    <rect x="740" y="492" width="190" height="56" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="752" y="526" fill="#0f172a">environment/prod</text>
  </g>

  <!-- PR arrows -->
  <path d="M530,200 H734" stroke="#6d28d9" stroke-width="2.5" fill="none" marker-end="url(#arrV)"/>
  <path d="M530,360 H734" stroke="#6d28d9" stroke-width="2.5" fill="none" marker-end="url(#arrV)"/>
  <path d="M530,520 H734" stroke="#6d28d9" stroke-width="2.5" fill="none" marker-end="url(#arrV)"/>

  <!-- PR pills -->
  <rect x="566" y="168" width="128" height="24" rx="12" fill="#ede9fe"/>
  <text x="630" y="185" font-size="12.5" text-anchor="middle" fill="#5b21b6" font-weight="bold">PR · auto-merge</text>
  <text x="632" y="222" font-size="12" text-anchor="middle" fill="#64748b">no gate</text>

  <rect x="566" y="328" width="128" height="24" rx="12" fill="#ede9fe"/>
  <text x="630" y="345" font-size="12.5" text-anchor="middle" fill="#5b21b6" font-weight="bold">PR · auto-merge</text>
  <text x="632" y="382" font-size="12" text-anchor="middle" fill="#64748b">waits for dev</text>

  <rect x="560" y="488" width="140" height="24" rx="12" fill="#fef3c7"/>
  <text x="630" y="505" font-size="12.5" text-anchor="middle" fill="#92400e" font-weight="bold">PR · manual merge</text>
  <text x="632" y="542" font-size="12" text-anchor="middle" fill="#64748b">waits for test + you</text>

  <!-- clusters -->
  <g>
    <rect x="990" y="168" width="170" height="64" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="1075" y="196" font-size="16" font-weight="bold" text-anchor="middle" fill="#14532d">dev-cluster</text>
    <text x="1075" y="218" font-size="12.5" text-anchor="middle" fill="#475569">OpenShift</text>
    <rect x="990" y="328" width="170" height="64" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="1075" y="356" font-size="16" font-weight="bold" text-anchor="middle" fill="#14532d">test-cluster</text>
    <text x="1075" y="378" font-size="12.5" text-anchor="middle" fill="#475569">OpenShift</text>
    <rect x="990" y="488" width="170" height="64" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="1075" y="516" font-size="16" font-weight="bold" text-anchor="middle" fill="#14532d">prod-cluster</text>
    <text x="1075" y="538" font-size="12.5" text-anchor="middle" fill="#475569">OpenShift</text>
  </g>

  <path d="M930,200 H984" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M930,360 H984" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M930,520 H984" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- health feedback -->
  <path d="M1075,232 V284 H640 V322" stroke="#15803d" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrG)"/>
  <rect x="790" y="270" width="170" height="26" rx="13" fill="#dcfce7"/>
  <text x="875" y="288" font-size="12.5" text-anchor="middle" fill="#14532d" font-weight="bold">argocd-health ✓ dev</text>

  <path d="M1075,392 V444 H640 V482" stroke="#15803d" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrG)"/>
  <rect x="790" y="430" width="170" height="26" rx="13" fill="#dcfce7"/>
  <text x="875" y="448" font-size="12.5" text-anchor="middle" fill="#14532d" font-weight="bold">argocd-health ✓ test</text>

  <text x="40" y="606" font-size="13" fill="#64748b">Argo CD syncs only the active branches. Branches named *-next are never deployed; they only hold the next proposal.</text>
</svg>
